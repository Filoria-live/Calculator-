
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #101410;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
}

.app {
    width: 100%;
    max-width: 440px;
}

.calculator, .scientific {
    background: #1c241e;
    padding: 18px;
    border-radius: 23px;
    box-shadow: 0 10px 40px #0008;
    margin-bottom: 15px;
}

h2, h3 {
    text-align: center;
    color: #8bd69c;
}

.display {
    background: #0d120e;
    border-radius: 15px;
    padding: 18px;
    min-height: 85px;
    margin-bottom: 15px;
    overflow-x: auto;
}

#current {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 32px;
    text-align: right;
    font-family: Arial, sans-serif;
    caret-color: #8bd69c;
    user-select: none;
    white-space: nowrap;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

button {
    border: none;
    border-radius: 13px;
    min-height: 57px;
    font-size: 21px;
    background: #303b32;
    color: white;
    cursor: pointer;
    transition: 0.12s;
    touch-action: manipulation;
}

button:active {
    transform: scale(0.94);
    background: #526b57;
}

.operator {
    background: #355b40;
}

.special {
    background: #604b36;
}

.equals {
    background: #71b77d;
    color: #101810;
}

.zero {
    grid-column: span 2;
}

.scientific button {
    background: #355b40;
    font-size: 18px;
    min-height: 52px;
}

.scientific .special {
    background: #604b36;
}

.scientific .power {
    background: #568b60;
    color: white;
    font-weight: bold;
}

.cursor-controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.cursor-controls button {
    flex: 1;
    min-height: 42px;
    font-size: 17px;
    background: #26352a;
}

@media (min-width: 700px) {
    .app {
        max-width: 650px;
    }

    .calculator, .scientific {
        padding: 25px;
    }

    button {
        min-height: 75px;
        font-size: 26px;
    }

    .scientific button {
        min-height: 65px;
        font-size: 22px;
    }

    #current {
        font-size: 42px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="calculator">

<h2>КАЛЬКУЛЯТОР</h2>

<div class="display">
    <input
        id="current"
        type="text"
        value=""
        placeholder="0"
        autocomplete="off"
        spellcheck="false"
        inputmode="none"
        readonly
    >
</div>

<div class="cursor-controls">
    <button onclick="moveCursor(-1)">← Курсор</button>
    <button onclick="moveCursor(1)">Курсор →</button>
</div>

<div class="buttons">

<button class="special" onclick="clearAll()">AC</button>
<button class="special" onclick="backspace()">⌫</button>
<button class="special" onclick="percent()">%</button>
<button class="operator" onclick="insert('/')">÷</button>

<button onclick="insert('7')">7</button>
<button onclick="insert('8')">8</button>
<button onclick="insert('9')">9</button>
<button class="operator" onclick="insert('*')">×</button>

<button onclick="insert('4')">4</button>
<button onclick="insert('5')">5</button>
<button onclick="insert('6')">6</button>
<button class="operator" onclick="insert('-')">−</button>

<button onclick="insert('1')">1</button>
<button onclick="insert('2')">2</button>
<button onclick="insert('3')">3</button>
<button class="operator" onclick="insert('+')">+</button>

<button class="zero" onclick="insert('0')">0</button>
<button onclick="insert('.')">.</button>
<button class="equals" onclick="calculate()">=</button>

</div>
</div>

<div class="scientific">

<h3>НАУЧНЫЕ ФУНКЦИИ</h3>

<div class="buttons">

<button class="power" onclick="insert('^')">xʸ</button>
<button onclick="insert('^2')">x²</button>
<button onclick="insert('^3')">x³</button>
<button onclick="squareRoot()">√</button>

<button onclick="trig('sin')">sin</button>
<button onclick="trig('cos')">cos</button>
<button onclick="trig('tan')">tan</button>
<button onclick="insert('Math.PI')">π</button>

<button onclick="logarithm()">log</button>
<button onclick="naturalLog()">ln</button>
<button onclick="insert('(')">(</button>
<button onclick="insert(')')">)</button>

<button onclick="fraction()">a/b</button>
<button onclick="toggleSign()">±</button>
<button onclick="factorial()">n!</button>
<button onclick="insert('.')">,</button>

</div>
</div>

</div>

<script>

const input = document.getElementById("current");

let expression = "";
let cursor = 0;
let resetNext = false;

function sync() {
    expression = input.value;
}

function update() {
    input.value = expression;
    cursor = Math.min(cursor, expression.length);
}

function insert(value) {

    sync();

    if (resetNext) {
        expression = "";
        cursor = 0;
        resetNext = false;
    }

    expression =
        expression.slice(0, cursor) +
        value +
        expression.slice(cursor);

    cursor += value.length;

    update();
}

function moveCursor(direction) {
    cursor = Math.max(
        0,
        Math.min(expression.length, cursor + direction)
    );
}

function clearAll() {
    expression = "";
    cursor = 0;
    resetNext = false;
    update();
}

function backspace() {

    sync();

    if (resetNext) {
        clearAll();
        return;
    }

    if (cursor > 0) {
        expression =
            expression.slice(0, cursor - 1) +
            expression.slice(cursor);

        cursor--;
    }

    update();
}

function getLastNumber() {

    const before = expression.slice(0, cursor);

    const match = before.match(
        /(?:\d+(?:\.\d*)?|\.\d+)$/
    );

    if (!match) return null;

    return {
        value: Number(match[0]),
        start: cursor - match[0].length,
        end: cursor
    };
}

function replaceLastNumber(value) {

    const item = getLastNumber();

    if (!item) return;

    expression =
        expression.slice(0, item.start) +
        String(value) +
        expression.slice(item.end);

    cursor = item.start + String(value).length;

    update();
}

function percent() {
    const item = getLastNumber();
    if (!item) return;
    replaceLastNumber(item.value / 100);
}

function toggleSign() {

    const item = getLastNumber();

    if (!item) return;

    replaceLastNumber(-item.value);
}

function squareRoot() {

    const item = getLastNumber();

    if (!item || item.value < 0) return;

    replaceLastNumber(Math.sqrt(item.value));
}

function trig(type) {

    const item = getLastNumber();

    if (!item) return;

    const radians = item.value * Math.PI / 180;

    let result;

    if (type === "sin") result = Math.sin(radians);
    if (type === "cos") result = Math.cos(radians);
    if (type === "tan") result = Math.tan(radians);

    if (!Number.isFinite(result)) return;

    replaceLastNumber(Number(result.toPrecision(12)));
}

function logarithm() {

    const item = getLastNumber();

    if (!item || item.value <= 0) return;

    replaceLastNumber(Math.log10(item.value));
}

function naturalLog() {

    const item = getLastNumber();

    if (!item || item.value <= 0) return;

    replaceLastNumber(Math.log(item.value));
}

function fraction() {

    const item = getLastNumber();

    if (!item) return;

    insert("/");
}

function factorial() {

    const item = getLastNumber();

    if (!item || item.value < 0 ||
        !Number.isInteger(item.value) ||
        item.value > 170) return;

    let result = 1;

    for (let i = 2; i <= item.value; i++) {
        result *= i;
    }

    replaceLastNumber(result);
}

function evaluate(source) {

    source = source.replace(/\s/g, "");

    const tokens = source.match(
        /(?:\d+(?:\.\d*)?|\.\d+)|Math\.PI|[()+\-*/^]/g
    );

    if (!tokens || tokens.join("") !== source) {
        throw new Error("Ошибка выражения");
    }

    let position = 0;

    function primary() {

        let token = tokens[position];

        if (token === "(") {
            position++;

            let value = add();

            if (tokens[position] !== ")") {
                throw new Error();
            }

            position++;
            return value;
        }

        if (token === "Math.PI") {
            position++;
            return Math.PI;
        }

        if (token === undefined ||
            !Number.isFinite(Number(token))) {
            throw new Error();
        }

        position++;
        return Number(token);
    }

    function power() {

        let value = primary();

        if (tokens[position] === "^") {
            position++;
            value = Math.pow(value, unary());
        }

        return value;
    }

    function unary() {

        if (tokens[position] === "-") {
            position++;
            return -unary();
        }

        if (tokens[position] === "+") {
            position++;
            return unary();
        }

        return power();
    }

    function multiply() {

        let value = unary();

        while (
            tokens[position] === "*" ||
            tokens[position] === "/"
        ) {
            let op = tokens[position++];

            if (op === "*") value *= unary();
            else value /= unary();
        }

        return value;
    }

    function add() {

        let value = multiply();

        while (
            tokens[position] === "+" ||
            tokens[position] === "-"
        ) {
            let op = tokens[position++];

            if (op === "+") value += multiply();
            else value -= multiply();
        }

        return value;
    }

    let result = add();

    if (position !== tokens.length ||
        !Number.isFinite(result)) {
        throw new Error();
    }

    return result;
}

function calculate() {

    if (!expression) return;

    try {

        const result = evaluate(expression);

        if (!Number.isFinite(result)) {
            throw new Error();
        }

        expression = String(Number(result.toPrecision(12)));
        cursor = expression.length;
        resetNext = true;

        update();

    } catch (error) {

        expression = "Ошибка";
        cursor = expression.length;
        resetNext = true;

        update();
    }
}

update();

</script>

</body>
    </html>
