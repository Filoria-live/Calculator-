
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #101410;
    --card: #1c241e;
    --display: #0d120e;
    --text: #ffffff;
    --heading: #8bd69c;
    --button: #303b32;
    --operator: #355b40;
    --special: #604b36;
    --equals: #71b77d;
    --equals-text: #101810;
    --cursor: #26352a;
    --shadow: #0008;
}

body[data-theme="dark"] {
    --bg: #171717;
    --card: #252525;
    --display: #111111;
    --text: #ffffff;
    --heading: #bbbbbb;
    --button: #393939;
    --operator: #505050;
    --special: #606060;
    --equals: #aaaaaa;
    --equals-text: #111111;
    --cursor: #333333;
}

body[data-theme="light"] {
    --bg: #eeeeee;
    --card: #ffffff;
    --display: #e9e9e9;
    --text: #222222;
    --heading: #333333;
    --button: #dddddd;
    --operator: #b8c9dc;
    --special: #e6cba9;
    --equals: #82b6e8;
    --equals-text: #102030;
    --cursor: #c9d5df;
    --shadow: #0002;
}

body[data-theme="matrix"] {
    --bg: #020b06;
    --card: #071b10;
    --display: #000b04;
    --text: #b5ffc9;
    --heading: #00ff66;
    --button: #103d23;
    --operator: #087b36;
    --special: #235a38;
    --equals: #00e65c;
    --equals-text: #001b09;
    --cursor: #10351e;
}

body[data-theme="ocean"] {
    --bg: #091727;
    --card: #142c45;
    --display: #081a2c;
    --text: #ffffff;
    --heading: #78caff;
    --button: #254969;
    --operator: #236b9e;
    --special: #536a83;
    --equals: #42a9e8;
    --equals-text: #071b2c;
    --cursor: #1b3c58;
}

body[data-theme="sunset"] {
    --bg: #24131a;
    --card: #3c2029;
    --display: #25141a;
    --text: #fff0e8;
    --heading: #ffb58e;
    --button: #633641;
    --operator: #a34d4b;
    --special: #875438;
    --equals: #ff956d;
    --equals-text: #35150e;
    --cursor: #512b36;
}

body[data-theme="amoled"] {
    --bg: #000000;
    --card: #101010;
    --display: #000000;
    --text: #ffffff;
    --heading: #c4c4c4;
    --button: #202020;
    --operator: #363636;
    --special: #494949;
    --equals: #ffffff;
    --equals-text: #000000;
    --cursor: #202020;
    --shadow: #000000;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
    transition: background .2s, color .2s;
}

.app {
    width: 100%;
    max-width: 440px;
}

.calculator, .scientific, .settings {
    background: var(--card);
    padding: 18px;
    border-radius: 23px;
    box-shadow: 0 10px 40px var(--shadow);
    margin-bottom: 15px;
    transition: background .2s;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

h2, h3 {
    text-align: center;
    color: var(--heading);
    margin: 8px 0;
}

.topbar h2 {
    flex: 1;
}

.settings-open {
    min-height: 43px;
    width: 48px;
    font-size: 23px;
    background: var(--operator);
    flex-shrink: 0;
}

.display {
    background: var(--display);
    border-radius: 15px;
    padding: 18px;
    min-height: 85px;
    margin-bottom: 15px;
    overflow-x: auto;
}

#current {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 32px;
    text-align: right;
    font-family: Arial, sans-serif;
    caret-color: var(--heading);
    user-select: none;
    white-space: nowrap;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

button {
    border: none;
    border-radius: 13px;
    min-height: 57px;
    font-size: 21px;
    background: var(--button);
    color: var(--text);
    cursor: pointer;
    transition: .12s;
    touch-action: manipulation;
}

button:active {
    transform: scale(.94);
    filter: brightness(1.2);
}

.operator {
    background: var(--operator);
}

.special {
    background: var(--special);
}

.equals {
    background: var(--equals);
    color: var(--equals-text);
}

.zero {
    grid-column: span 2;
}

.scientific button {
    background: var(--operator);
    font-size: 18px;
    min-height: 52px;
}

.scientific .special {
    background: var(--special);
}

.scientific .power {
    background: var(--equals);
    color: var(--equals-text);
    font-weight: bold;
}

.cursor-controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.cursor-controls button {
    flex: 1;
    min-height: 42px;
    font-size: 17px;
    background: var(--cursor);
}

/* НАСТРОЙКИ */

.settings {
    display: none;
}

.settings.active {
    display: block;
}

.settings-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.settings-title h2 {
    margin: 0;
}

.back-button {
    min-height: 42px;
    padding: 0 15px;
    background: var(--operator);
    font-size: 16px;
}

.settings-description {
    color: var(--text);
    opacity: .7;
    font-size: 14px;
    margin-bottom: 15px;
}

.theme-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.theme-option {
    min-height: 105px;
    border: 2px solid transparent;
    padding: 12px;
    border-radius: 15px;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 16px;
}

.theme-option.selected {
    border: 2px solid var(--heading);
}

.theme-option .preview {
    font-size: 22px;
    font-weight: bold;
}

.theme-option .theme-name {
    font-size: 15px;
}

.theme-option[data-choice="matrix"] {
    background: #071b10;
    color: #00ff66;
}

.theme-option[data-choice="dark"] {
    background: #252525;
    color: white;
}

.theme-option[data-choice="light"] {
    background: #eeeeee;
    color: #222222;
}

.theme-option[data-choice="ocean"] {
    background: #142c45;
    color: #78caff;
}

.theme-option[data-choice="sunset"] {
    background: #3c2029;
    color: #ffb58e;
}

.theme-option[data-choice="amoled"] {
    background: #000000;
    color: white;
}

.reset-theme {
    width: 100%;
    margin-top: 18px;
    min-height: 48px;
    background: var(--special);
    font-size: 16px;
}

@media (min-width: 700px) {
    .app {
        max-width: 650px;
    }

    .calculator, .scientific, .settings {
        padding: 25px;
    }

    button {
        min-height: 75px;
        font-size: 26px;
    }

    .scientific button {
        min-height: 65px;
        font-size: 22px;
    }

    #current {
        font-size: 42px;
    }
}
</style>
</head>

<body data-theme="matrix">

<div class="app">

<!-- КАЛЬКУЛЯТОР -->

<div class="calculator" id="calculator">

<div class="topbar">
    <h2>КАЛЬКУЛЯТОР</h2>
    <button class="settings-open" onclick="openSettings()">⚙️</button>
</div>

<div class="display">
    <input
        id="current"
        type="text"
        value=""
        placeholder="0"
        autocomplete="off"
        spellcheck="false"
        inputmode="none"
        readonly
    >
</div>

<div class="cursor-controls">
    <button onclick="moveCursor(-1)">← Курсор</button>
    <button onclick="moveCursor(1)">Курсор →</button>
</div>

<div class="buttons">

<button class="special" onclick="clearAll()">AC</button>
<button class="special" onclick="backspace()">⌫</button>
<button class="special" onclick="percent()">%</button>
<button class="operator" onclick="insert('/')">÷</button>

<button onclick="insert('7')">7</button>
<button onclick="insert('8')">8</button>
<button onclick="insert('9')">9</button>
<button class="operator" onclick="insert('*')">×</button>

<button onclick="insert('4')">4</button>
<button onclick="insert('5')">5</button>
<button onclick="insert('6')">6</button>
<button class="operator" onclick="insert('-')">−</button>

<button onclick="insert('1')">1</button>
<button onclick="insert('2')">2</button>
<button onclick="insert('3')">3</button>
<button class="operator" onclick="insert('+')">+</button>

<button class="zero" onclick="insert('0')">0</button>
<button onclick="insert('.')">.</button>
<button class="equals" onclick="calculate()">=</button>

</div>
</div>

<!-- НАУЧНЫЕ ФУНКЦИИ -->

<div class="scientific" id="scientific">

<h3>НАУЧНЫЕ ФУНКЦИИ</h3>

<div class="buttons">

<button class="power" onclick="insert('^')">xʸ</button>
<button onclick="insert('^2')">x²</button>
<button onclick="insert('^3')">x³</button>
<button onclick="squareRoot()">√</button>

<button onclick="trig('sin')">sin</button>
<button onclick="trig('cos')">cos</button>
<button onclick="trig('tan')">tan</button>
<button onclick="insert('Math.PI')">π</button>

<button onclick="logarithm()">log</button>
<button onclick="naturalLog()">ln</button>
<button onclick="insert('(')">(</button>
<button onclick="insert(')')">)</button>

<button onclick="fraction()">a/b</button>
<button onclick="toggleSign()">±</button>
<button onclick="factorial()">n!</button>
<button onclick="insert('.')">,</button>

</div>
</div>

<!-- ОКНО НАСТРОЕК -->

<div class="settings" id="settings">

<div class="settings-title">
    <h2>НАСТРОЙКИ</h2>
    <button class="back-button" onclick="closeSettings()">← Назад</button>
</div>

<h3>Оформление</h3>

<p class="settings-description">
Выбери тему для своего калькулятора.
Изменения применяются сразу.
</p>

<div class="theme-list">

<button class="theme-option" data-choice="matrix" onclick="setTheme('matrix')">
    <span class="preview">123 + 456</span>
    <span class="theme-name">🟢 Matrix</span>
</button>

<button class="theme-option" data-choice="dark" onclick="setTheme('dark')">
    <span class="preview">123 + 456</span>
    <span class="theme-name">⚫ Dark</span>
</button>

<button class="theme-option" data-choice="light" onclick="setTheme('light')">
    <span class="preview">123 + 456</span>
    <span class="theme-name">⚪ Light</span>
</button>

<button class="theme-option" data-choice="ocean" onclick="setTheme('ocean')">
    <span class="preview">123 + 456</span>
    <span class="theme-name">🔵 Ocean</span>
</button>

<button class="theme-option" data-choice="sunset" onclick="setTheme('sunset')">
    <span class="preview">123 + 456</span>
    <span class="theme-name">🟠 Sunset</span>
</button>

<button class="theme-option" data-choice="amoled" onclick="setTheme('amoled')">
    <span class="preview">123 + 456</span>
    <span class="theme-name">⚫ AMOLED</span>
</button>

</div>

<button class="reset-theme" onclick="setTheme('matrix')">
    Вернуть стандартную тему
</button>

</div>

</div>

<script>

const input = document.getElementById("current");

let expression = "";
let cursor = 0;
let resetNext = false;

/* ТЕМЫ */

function setTheme(theme) {

    const allowed = [
        "matrix",
        "dark",
        "light",
        "ocean",
        "sunset",
        "amoled"
    ];

    if (!allowed.includes(theme)) return;

    document.body.dataset.theme = theme;

    try {
        localStorage.setItem("calculatorTheme", theme);
    } catch (e) {}

    document.querySelectorAll(".theme-option").forEach(button => {
        button.classList.toggle(
            "selected",
            button.dataset.choice === theme
        );
    });
}

function loadTheme() {

    let saved = "matrix";

    try {
        saved = localStorage.getItem("calculatorTheme") || "matrix";
    } catch (e) {}

    setTheme(saved);
}

/* ОКНО НАСТРОЕК */

function openSettings() {
    document.getElementById("calculator").style.display = "none";
    document.getElementById("scientific").style.display = "none";
    document.getElementById("settings").classList.add("active");
}

function closeSettings() {
    document.getElementById("settings").classList.remove("active");
    document.getElementById("calculator").style.display = "";
    document.getElementById("scientific").style.display = "";
}

/* КАЛЬКУЛЯТОР */

function sync() {
    expression = input.value;
}

function update() {
    input.value = expression;
    cursor = Math.min(cursor, expression.length);
}

function insert(value) {

    sync();

    if (resetNext) {
        expression = "";
        cursor = 0;
        resetNext = false;
    }

    expression =
        expression.slice(0, cursor) +
        value +
        expression.slice(cursor);

    cursor += value.length;

    update();
}

function moveCursor(direction) {
    cursor = Math.max(
        0,
        Math.min(expression.length, cursor + direction)
    );
}

function clearAll() {
    expression = "";
    cursor = 0;
    resetNext = false;
    update();
}

function backspace() {

    sync();

    if (resetNext) {
        clearAll();
        return;
    }

    if (cursor > 0) {
        expression =
            expression.slice(0, cursor - 1) +
            expression.slice(cursor);

        cursor--;
    }

    update();
}

function getLastNumber() {

    const before = expression.slice(0, cursor);

    const match = before.match(
        /(?:\d+(?:\.\d*)?|\.\d+)$/
    );

    if (!match) return null;

    return {
        value: Number(match[0]),
        start: cursor - match[0].length,
        end: cursor
    };
}

function replaceLastNumber(value) {

    const item = getLastNumber();

    if (!item) return;

    expression =
        expression.slice(0, item.start) +
        String(value) +
        expression.slice(item.end);

    cursor = item.start + String(value).length;

    update();
}

function percent() {
    const item = getLastNumber();
    if (!item) return;
    replaceLastNumber(item.value / 100);
}

function toggleSign() {

    const item = getLastNumber();

    if (!item) return;

    replaceLastNumber(-item.value);
}

function squareRoot() {

    const item = getLastNumber();

    if (!item || item.value < 0) return;

    replaceLastNumber(Math.sqrt(item.value));
}

function trig(type) {

    const item = getLastNumber();

    if (!item) return;

    const radians = item.value * Math.PI / 180;

    let result;

    if (type === "sin") result = Math.sin(radians);
    if (type === "cos") result = Math.cos(radians);
    if (type === "tan") result = Math.tan(radians);

    if (!Number.isFinite(result)) return;

    replaceLastNumber(Number(result.toPrecision(12)));
}

function logarithm() {

    const item = getLastNumber();

    if (!item || item.value <= 0) return;

    replaceLastNumber(Math.log10(item.value));
}

function naturalLog() {

    const item = getLastNumber();

    if (!item || item.value <= 0) return;

    replaceLastNumber(Math.log(item.value));
}

function fraction() {

    const item = getLastNumber();

    if (!item) return;

    insert("/");
}

function factorial() {

    const item = getLastNumber();

    if (!item || item.value < 0 ||
        !Number.isInteger(item.value) ||
        item.value > 170) return;

    let result = 1;

    for (let i = 2; i <= item.value; i++) {
        result *= i;
    }

    replaceLastNumber(result);
}

/* ВЫЧИСЛЕНИЯ */

function evaluate(source) {

    source = source.replace(/\s/g, "");

    const tokens = source.match(
        /(?:\d+(?:\.\d*)?|\.\d+)|Math\.PI|[()+\-*/^]/g
    );

    if (!tokens || tokens.join("") !== source) {
        throw new Error("Ошибка выражения");
    }

    let position = 0;

    function primary() {

        let token = tokens[position];

        if (token === "(") {
            position++;

            let value = add();

            if (tokens[position] !== ")") {
                throw new Error();
            }

            position++;
            return value;
        }

        if (token === "Math.PI") {
            position++;
            return Math.PI;
        }

        if (token === undefined ||
            !Number.isFinite(Number(token))) {
            throw new Error();
        }

        position++;
        return Number(token);
    }

    function power() {

        let value = primary();

        if (tokens[position] === "^") {
            position++;
            value = Math.pow(value, unary());
        }

        return value;
    }

    function unary() {

        if (tokens[position] === "-") {
            position++;
            return -unary();
        }

        if (tokens[position] === "+") {
            position++;
            return unary();
        }

        return power();
    }

    function multiply() {

        let value = unary();

        while (
            tokens[position] === "*" ||
            tokens[position] === "/"
        ) {
            let op = tokens[position++];

            if (op === "*") value *= unary();
            else value /= unary();
        }

        return value;
    }

    function add() {

        let value = multiply();

        while (
            tokens[position] === "+" ||
            tokens[position] === "-"
        ) {
            let op = tokens[position++];

            if (op === "+") value += multiply();
            else value -= multiply();
        }

        return value;
    }

    let result = add();

    if (position !== tokens.length ||
        !Number.isFinite(result)) {
        throw new Error();
    }

    return result;
}

function calculate() {

    if (!expression) return;

    try {

        const result = evaluate(expression);

        if (!Number.isFinite(result)) {
            throw new Error();
        }

        expression = String(Number(result.toPrecision(12)));
        cursor = expression.length;
        resetNext = true;

        update();

    } catch (error) {

        expression = "Ошибка";
        cursor = expression.length;
        resetNext = true;

        update();
    }
}

/* ЗАПУСК */

loadTheme();
update();

</script>

</body>
</html>
