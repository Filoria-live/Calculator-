
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #101410;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
}

.app {
    width: 100%;
    max-width: 440px;
}

.calculator, .scientific {
    background: #1c241e;
    padding: 18px;
    border-radius: 23px;
    box-shadow: 0 10px 40px #0008;
    margin-bottom: 15px;
}

h2, h3 {
    text-align: center;
    color: #8bd69c;
}

.display {
    background: #0d120e;
    border-radius: 15px;
    padding: 18px;
    min-height: 85px;
    margin-bottom: 15px;
}

#current {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 32px;
    text-align: right;
    font-family: Arial, sans-serif;
    caret-color: #8bd69c;
}

#current::selection {
    background: #426e4b;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

button {
    border: none;
    border-radius: 13px;
    min-height: 57px;
    font-size: 21px;
    background: #303b32;
    color: white;
    cursor: pointer;
    transition: 0.12s;
}

button:active {
    transform: scale(0.94);
    background: #526b57;
}

.operator {
    background: #355b40;
}

.special {
    background: #604b36;
}

.equals {
    background: #71b77d;
    color: #101810;
}

.zero {
    grid-column: span 2;
}

.scientific button {
    background: #355b40;
    font-size: 18px;
    min-height: 52px;
}

.scientific .special {
    background: #604b36;
}

@media (min-width: 700px) {
    .app {
        max-width: 650px;
    }

    .calculator, .scientific {
        padding: 25px;
    }

    button {
        min-height: 75px;
        font-size: 26px;
    }

    .scientific button {
        min-height: 65px;
        font-size: 22px;
    }

    #current {
        font-size: 42px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="calculator">

<h2>КАЛЬКУЛЯТОР</h2>

<div class="display">
    <input
        id="current"
        type="text"
        value=""
        placeholder="0"
        autocomplete="off"
        spellcheck="false"
        aria-label="Математическое выражение"
    >
</div>

<div class="buttons">

<button class="special" onclick="clearAll()">AC</button>
<button class="special" onclick="backspace()">⌫</button>
<button class="special" onclick="percent()">%</button>
<button class="operator" onclick="insert('/')">÷</button>

<button onclick="insert('7')">7</button>
<button onclick="insert('8')">8</button>
<button onclick="insert('9')">9</button>
<button class="operator" onclick="insert('*')">×</button>

<button onclick="insert('4')">4</button>
<button onclick="insert('5')">5</button>
<button onclick="insert('6')">6</button>
<button class="operator" onclick="insert('-')">−</button>

<button onclick="insert('1')">1</button>
<button onclick="insert('2')">2</button>
<button onclick="insert('3')">3</button>
<button class="operator" onclick="insert('+')">+</button>

<button class="zero" onclick="insert('0')">0</button>
<button onclick="insert('.')">.</button>
<button class="equals" onclick="calculate()">=</button>

</div>
</div>

<div class="scientific">

<h3>НАУЧНЫЕ ФУНКЦИИ</h3>

<div class="buttons">

<button onclick="insert('/')">a/b</button>
<button onclick="insert('^2')">x²</button>
<button onclick="insert('^3')">x³</button>
<button onclick="squareRoot()">√</button>

<button onclick="trig('sin')">sin</button>
<button onclick="trig('cos')">cos</button>
<button onclick="trig('tan')">tan</button>
<button onclick="insert('Math.PI')">π</button>

<button onclick="logarithm()">log</button>
<button onclick="naturalLog()">ln</button>
<button onclick="insert('(')">(</button>
<button onclick="insert(')')">)</button>

<button onclick="insert('^')">xʸ</button>
<button onclick="toggleSign()">±</button>
<button onclick="factorial()">n!</button>
<button onclick="insert('.')">,</button>

</div>
</div>

</div>

<script>

const input = document.getElementById("current");

let expression = "";
let resetNext = false;

input.addEventListener("input", () => {
    expression = input.value;
    resetNext = false;
});

function sync() {
    expression = input.value;
}

function insert(value) {

    sync();

    if (resetNext) {
        expression = "";
        input.value = "";
        resetNext = false;
    }

    const start = input.selectionStart;
    const end = input.selectionEnd;

    input.setRangeText(value, start, end, "end");

    sync();
    input.focus();
}

function clearAll() {
    expression = "";
    input.value = "";
    resetNext = false;
    input.focus();
}

function backspace() {

    sync();

    if (resetNext) {
        clearAll();
        return;
    }

    const start = input.selectionStart;
    const end = input.selectionEnd;

    if (start !== end) {
        input.setRangeText("", start, end, "start");
    } else if (start > 0) {
        input.setRangeText("", start - 1, start, "start");
    }

    sync();
    input.focus();
}

function addResult(value) {
    expression = String(value);
    input.value = expression;
    resetNext = true;
}

function getLastNumber() {
    sync();

    const before = input.value.slice(0, input.selectionStart);
    const match = before.match(/(?:\d+(?:\.\d*)?|\.\d+)$/);

    return match ? {
        value: Number(match[0]),
        start: input.selectionStart - match[0].length,
        end: input.selectionStart
    } : null;
}

function replaceLastNumber(value) {

    const item = getLastNumber();

    if (!item) return;

    input.setRangeText(
        String(value),
        item.start,
        item.end,
        "end"
    );

    sync();
    input.focus();
}

function percent() {
    const item = getLastNumber();

    if (!item) return;

    replaceLastNumber(item.value / 100);
}

function toggleSign() {
    const item = getLastNumber();

    if (!item) return;

    replaceLastNumber(-item.value);
}

function squareRoot() {
    const item = getLastNumber();

    if (!item || item.value < 0) return;

    replaceLastNumber(Math.sqrt(item.value));
}

function trig(type) {

    const item = getLastNumber();

    if (!item) return;

    const radians = item.value * Math.PI / 180;

    let result;

    if (type === "sin") result = Math.sin(radians);
    if (type === "cos") result = Math.cos(radians);
    if (type === "tan") result = Math.tan(radians);

    if (!Number.isFinite(result)) return;

    replaceLastNumber(Number(result.toPrecision(12)));
}

function logarithm() {
    const item = getLastNumber();

    if (!item || item.value <= 0) return;

    replaceLastNumber(Math.log10(item.value));
}

function naturalLog() {
    const item = getLastNumber();

    if (!item || item.value <= 0) return;

    replaceLastNumber(Math.log(item.value));
}

function factorial() {

    const item = getLastNumber();

    if (!item || item.value < 0 ||
        !Number.isInteger(item.value) ||
        item.value > 170) return;

    let result = 1;

    for (let i = 2; i <= item.value; i++) {
        result *= i;
    }

    replaceLastNumber(result);
}

// Математический парсер

function evaluate(source) {

    source = source.replace(/\s/g, "");

    const tokens = source.match(
        /(?:\d+(?:\.\d*)?|\.\d+)|Math\.PI|[()+\-*/^]/g
    );

    if (!tokens || tokens.join("") !== source) {
        throw new Error("Ошибка выражения");
    }

    let position = 0;

    function primary() {

        let token = tokens[position];

        if (token === "(") {
            position++;

            let value = add();

            if (tokens[position] !== ")") {
                throw new Error("Скобки");
            }

            position++;

            return value;
        }

        if (token === "Math.PI") {
            position++;
            return Math.PI;
        }

        if (token === undefined ||
            !Number.isFinite(Number(token))) {
            throw new Error("Число");
        }

        position++;

        return Number(token);
    }

    function power() {

        let value = primary();

        if (tokens[position] === "^") {
            position++;
            value = Math.pow(value, unary());
        }

        return value;
    }

    function unary() {

        if (tokens[position] === "-") {
            position++;
            return -unary();
        }

        if (tokens[position] === "+") {
            position++;
            return unary();
        }

        return power();
    }

    function multiply() {

        let value = unary();

        while (
            tokens[position] === "*" ||
            tokens[position] === "/"
        ) {
            let op = tokens[position++];

            if (op === "*") {
                value *= unary();
            } else {
                value /= unary();
            }
        }

        return value;
    }

    function add() {

        let value = multiply();

        while (
            tokens[position] === "+" ||
            tokens[position] === "-"
        ) {
            let op = tokens[position++];

            if (op === "+") {
                value += multiply();
            } else {
                value -= multiply();
            }
        }

        return value;
    }

    let result = add();

    if (position !== tokens.length ||
        !Number.isFinite(result)) {
        throw new Error("Ошибка вычисления");
    }

    return result;
}

function calculate() {

    sync();

    if (!expression) return;

    try {

        const result = evaluate(expression);

        addResult(Number(result.toPrecision(12)));

    } catch (error) {

        input.value = "Ошибка";
        expression = "";
        resetNext = true;
    }

    input.focus();
}

// Вычисление по Enter

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        calculate();
    }

    if (event.key === "Escape") {
        clearAll();
    }

});

</script>

</body>
</html>
