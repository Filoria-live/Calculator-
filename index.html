
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #101410;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.calculator {
    width: 100%;
    max-width: 380px;
    background: #1c241e;
    padding: 22px;
    border-radius: 25px;
    box-shadow: 0 10px 40px #0008;
}

h2 {
    text-align: center;
    color: #8bd69c;
}

.display {
    background: #0d120e;
    border-radius: 15px;
    padding: 20px;
    min-height: 110px;
    margin-bottom: 20px;
    text-align: right;
    overflow: hidden;
}

#previous {
    display: none;
}

#current {
    font-size: 36px;
    margin-top: 10px;
    white-space: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    direction: ltr;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    border: none;
    border-radius: 15px;
    height: 65px;
    font-size: 23px;
    background: #303b32;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(0.94);
    background: #526b57;
}

.operator {
    background: #355b40;
}

.special {
    background: #604b36;
}

.equals {
    background: #71b77d;
    color: #101810;
}

.zero {
    grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculator">

    <h2>КАЛЬКУЛЯТОР</h2>

    <div class="display">
        <div id="previous"></div>
        <div id="current">0</div>
    </div>

    <div class="buttons">

        <button class="special" onclick="clearAll()">AC</button>
        <button class="special" onclick="backspace()">⌫</button>
        <button class="special" onclick="percent()">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="digit('7')">7</button>
        <button onclick="digit('8')">8</button>
        <button onclick="digit('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="digit('4')">4</button>
        <button onclick="digit('5')">5</button>
        <button onclick="digit('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="digit('1')">1</button>
        <button onclick="digit('2')">2</button>
        <button onclick="digit('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button class="zero" onclick="digit('0')">0</button>
        <button onclick="digit('.')">.</button>
        <button class="equals" onclick="calculate()">=</button>

    </div>
</div>

<script>

let expression = "";
let resetNext = false;

const currentDisplay = document.getElementById("current");

function update() {
    currentDisplay.textContent = expression || "0";
}

function digit(value) {

    if (resetNext) {
        expression = "";
        resetNext = false;
    }

    let lastNumber = expression.split(/[+\-*/]/).pop();

    if (value === "." && lastNumber.includes(".")) return;

    expression += value;
    update();
}

function chooseOperator(op) {

    if (resetNext) {
        resetNext = false;
    }

    if (!expression) return;

    if (/[+\-*/.]$/.test(expression)) {
        expression = expression.slice(0, -1);
    }

    expression += op;
    update();
}

function calculate() {

    if (!expression) return;

    try {

        if (!/^[0-9+\-*/.() ]+$/.test(expression)) {
            throw new Error("Invalid expression");
        }

        if (/[+\-*/.]$/.test(expression)) return;

        let result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(result)) {
            throw new Error("Math error");
        }

        expression = String(Number(result.toPrecision(12)));

        resetNext = true;
        update();

    } catch (error) {

        expression = "";
        currentDisplay.textContent = "Ошибка";
    }
}

function clearAll() {

    expression = "";
    resetNext = false;
    update();
}

function backspace() {

    if (resetNext) {
        clearAll();
        return;
    }

    expression = expression.slice(0, -1);
    update();
}

function percent() {

    if (!expression || resetNext) return;

    let match = expression.match(/(\d+\.?\d*)$/);

    if (match) {

        let value = Number(match[0]) / 100;

        expression =
            expression.slice(0, -match[0].length) + value;

        update();
    }
}

</script>

</body>
</html>
